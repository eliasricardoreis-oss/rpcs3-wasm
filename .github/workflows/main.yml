- name: Clean Git Submodule Cache and Artifacts
        run: |
          # Remove resíduos de build antigos
          rm -rf build_cmake/build
          
          # Remove referências corrompidas de submódulos do índice do Git se existirem
          git rm --cached build_cmake/build/root-wasm/_deps/absl-src || true
          rm -rf .git/modules/build_cmake/build/root-wasm/_deps/absl-src || true

      - name: Initialize and Update Official Submodules
        run: |
          git submodule sync
          # Atualiza apenas os submódulos recursivos que estão dentro de 3rdparty, evitando pastas de build
          git submodule update --init --recursive --force
