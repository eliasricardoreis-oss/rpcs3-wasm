<!doctype html>
<html lang="en">

<head>
  <script src="coi-serviceworker.js"></script>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A PlayStation 3 emulator for web browsers (WebGPU POC)" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>RPCS3.js — WebGPU PS3 POC</title>
  <style>
    html {
      background-color: #000000;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      -ms-touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      -ms-touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .global-row {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    .global-column {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .global-column>div:first-child {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* PS3 native is 1280x720 (16:9). Canvas defaults to that aspect; the
       layout below scales it to fit the viewport while preserving ratio. */
    #outputCanvas {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      position: relative;
      z-index: 1;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    #outputCanvas:focus,
    #outputCanvas:focus-visible {
      outline: none;
      border: none;
    }

    @media screen and (orientation: landscape) {
      #outputCanvas {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain;
      }
    }

    @media screen and (min-width: 768px) and (orientation: landscape) {
      #outputCanvas {
        width: min(100vw, 100%) !important;
        height: min(100vh, 100%) !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain;
      }
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      .global-column>div:first-child {
        align-items: flex-start;
        padding-top: 2vh;
      }
      #outputCanvas {
        width: min(95vw, calc((100vh - 4vh) * 16 / 9));
        height: auto;
        max-width: 95vw;
        max-height: calc(100vh - 4vh);
        object-fit: contain;
      }
    }

    @media screen and (min-width: 769px) and (orientation: portrait) {
      .global-column>div:first-child {
        align-items: flex-start;
        padding-top: 2vh;
      }
      #outputCanvas {
        width: min(95vw, calc((100vh - 4vh) * 16 / 9));
        height: auto;
        max-width: 95vw;
        max-height: calc(100vh - 4vh);
        object-fit: contain;
      }
    }

    #root {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
    }

    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
  <div class="global-row">
    <div class="global-column">
      <div><canvas id="outputCanvas" width="1280" height="720" tabindex="-1" /></div>
      <div id="root"></div>
    </div>
  </div>
</body>

</html>
